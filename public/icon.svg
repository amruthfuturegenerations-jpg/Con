<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  
  <!-- Base Background with rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  
  <!-- Industrial Accent Border & Corner Notches -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="16 12"/>
  
  <!-- Hard Hat / Industrial Badge Header -->
  <path d="M156 180 C156 120 200 96 256 96 C312 96 356 120 356 180 Z" fill="url(#amberGrad)"/>
  <rect x="136" y="174" width="240" height="24" rx="12" fill="#d97706"/>
  <rect x="238" y="104" width="36" height="70" rx="4" fill="#fde68a" opacity="0.8"/>
  
  <!-- Clipboard / Task Board Body -->
  <rect x="120" y="216" width="272" height="216" rx="20" fill="#1e293b" stroke="#f59e0b" stroke-width="6"/>
  
  <!-- Task lines & Checkmarks -->
  <!-- Item 1: Complete -->
  <circle cx="168" cy="270" r="16" fill="#10b981"/>
  <path d="M161 270 L166 275 L176 264" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="200" y="262" width="160" height="16" rx="8" fill="#e2e8f0"/>
  
  <!-- Item 2: In Progress -->
  <circle cx="168" cy="324" r="16" fill="#f59e0b"/>
  <circle cx="168" cy="324" r="7" fill="#ffffff"/>
  <rect x="200" y="316" width="130" height="16" rx="8" fill="#94a3b8"/>
  
  <!-- Item 3: Pending/Priority -->
  <circle cx="168" cy="378" r="16" fill="#ef4444"/>
  <line x1="168" y1="370" x2="168" y2="378" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="168" cy="384" r="2" fill="#ffffff"/>
  <rect x="200" y="370" width="145" height="16" rx="8" fill="#64748b"/>
  
  <!-- Small Gear / Tool Badge in Bottom Right -->
  <circle cx="384" cy="396" r="32" fill="#0284c7" stroke="#0f172a" stroke-width="6"/>
  <path d="M384 376 L384 416 M364 396 L404 396 M370 382 L398 410 M370 410 L398 382" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="384" cy="396" r="10" fill="#0f172a"/>
</svg>
